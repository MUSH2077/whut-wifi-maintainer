name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['maintainer/**']

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run tests
        run: cargo +stable test --locked
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo +stable build --release --locked

  openwrt:
    name: OpenWrt ARM64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y libncurses-dev unzip zstd
      - name: Install Rust target
        run: rustup target add aarch64-unknown-linux-musl
      - name: Download verified SDK
        env:
          BUILD_ROOT: ${{ runner.temp }}/openwrt
        run: |
          mkdir -p "$BUILD_ROOT"
          url=$(python3 -c 'import json; print(json.load(open("packaging/openwrt/sdk.json"))["url"])')
          digest=$(python3 -c 'import json; print(json.load(open("packaging/openwrt/sdk.json"))["sha256"])')
          curl -fsSL --retry 3 "$url" -o "$BUILD_ROOT/sdk.tar.zst"
          printf '%s  %s\n' "$digest" "$BUILD_ROOT/sdk.tar.zst" | sha256sum -c -
          mkdir "$BUILD_ROOT/sdk"
          tar --zstd -xf "$BUILD_ROOT/sdk.tar.zst" -C "$BUILD_ROOT/sdk" --strip-components=1
          cd "$BUILD_ROOT/sdk"
          ./scripts/feeds update base packages
      - name: Test build isolation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build APK and manifest
        run: python3 scripts/build_openwrt.py --sdk "${{ runner.temp }}/openwrt/sdk" --output "${{ runner.temp }}/openwrt/output" --system-rust --package-release 2
      - name: Upload commit-pinned OpenWrt artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whut-openwrt-${{ github.sha }}
          path: ${{ runner.temp }}/openwrt/output/
          if-no-files-found: error
          retention-days: 30
